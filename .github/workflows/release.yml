name: Publish 0.1.0 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-0.1.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: training-eval
        working-directory: ${{ runner.temp }}
      - name: Publish versioned wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists"
          else
            gh release create v0.1.0 dist/*.whl --target "$GITHUB_SHA" --title "Training evaluation practice 0.1.0" --notes "MIT-licensed local response comparison CLI. Includes JSON input, accuracy thresholds, validation, and a Python wheel. Synthetic examples demonstrate comparison behavior. Real model quality and production operation remain unverified."
          fi
