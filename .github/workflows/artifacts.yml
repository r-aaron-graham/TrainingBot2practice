name: Build distribution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Verify license in wheel
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              assert "training_eval.py" in archive.namelist()
              assert any(name.endswith("/LICENSE") for name in archive.namelist())
          PY
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: training-eval
        working-directory: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        with:
          name: training-bot-evaluation-practice-0.1.0
          path: dist/*.whl
          if-no-files-found: error
