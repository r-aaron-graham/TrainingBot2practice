name: Package security and container checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . bandit==1.8.6
      - run: bandit -q training_eval.py
      - run: training-eval
        working-directory: ${{ runner.temp }}
      - run: docker build -t training-eval .
      - run: docker run --rm --read-only --network none training-eval python -m unittest -v
      - run: docker run --rm --read-only --network none training-eval
